name: Build iOS App

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Install frontend dependencies
        run: npm install

      - name: Build iOS App
        run: npx tauri build --target aarch64-apple-ios

      - name: Upload iOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HHub-iOS
          path: src-tauri/target/aarch64-apple-ios/release/bundle/ios/*.ipa
