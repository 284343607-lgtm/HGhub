name: Build iOS App

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build iOS App
        run: pnpm tauri build --target aarch64-apple-ios

      - name: Package all build outputs
        run: |
          echo "Searching for all build outputs..."
          # 强行把整个 target 目录下的核心产物打包，不管它是什么格式
          mkdir -p final_output
          
          # 尝试寻找 .app 文件夹
          APP_PATH=$(find ./src-tauri/target -iname "*.app" -type d | head -n 1)
          if [ -n "$APP_PATH" ]; then
            echo "Found .app at: $APP_PATH"
            cp -R "$APP_PATH" final_output/
          fi
          
          # 尝试寻找 Xcode 工程文件 (.xcodeproj)
          XCODE_PATH=$(find ./src-tauri/target -iname "*.xcodeproj" -type d | head -n 1)
          if [ -n "$XCODE_PATH" ]; then
            echo "Found .xcodeproj at: $XCODE_PATH"
            cp -R "$XCODE_PATH" final_output/
          fi

          # 尝试寻找编译好的二进制可执行文件 (通常没有后缀，或者在 debug/release 目录下)
          BIN_PATH=$(find ./src-tauri/target/aarch64-apple-ios -type f -perm +111 -not -name "*.rs" -not -name "*.json" | head -n 1)
          if [ -n "$BIN_PATH" ]; then
            echo "Found binary at: $BIN_PATH"
            cp "$BIN_PATH" final_output/
          fi

          # 强行打包成 ipa
          zip -qry HHub-all-in-one.ipa final_output
          echo "IPA_PATH=HHub-all-in-one.ipa" >> $GITHUB_ENV

      - name: Upload iOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HHub-iOS
          path: ${{ env.IPA_PATH }}
