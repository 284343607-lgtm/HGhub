name: Build iOS App

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build iOS App
        run: pnpm tauri build --target aarch64-apple-ios

      - name: Force create unsigned IPA
        run: |
          echo "Searching for .app files in debug folder..."
          # 这次我们直接去 debug 文件夹里找，并且忽略大小写
          APP_PATH=$(find ./src-tauri/target/aarch64-apple-ios/debug -iname "*.app" -type d | head -n 1)
          
          if [ -z "$APP_PATH" ]; then
            echo "Error: No .app file found in debug folder!"
            exit 1
          fi
          echo "Found APP at: $APP_PATH"
          
          # 强行打包成未签名的 ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry HHub-unsigned.ipa Payload
          echo "IPA_PATH=HHub-unsigned.ipa" >> $GITHUB_ENV

      - name: Upload iOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HHub-iOS
          path: ${{ env.IPA_PATH }}
